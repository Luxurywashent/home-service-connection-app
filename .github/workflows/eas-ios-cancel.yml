name: Cancel Home Service Connection EAS build
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build ID to cancel
        required: true
        type: string
permissions:
  contents: read
jobs:
  cancel:
    name: Cancel private EAS build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest build:cancel "${{ inputs.build_id }}" --non-interactive
