name: Home Service Connection iOS build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - production
          - testflight
          - preview
      status_build_id:
        description: Optional EAS build ID to monitor instead of creating a build
        required: false
        type: string

permissions:
  contents: read

jobs:
  status:
    if: ${{ inputs.status_build_id != '' }}
    name: Monitor private Expo iOS build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Monitor EAS build status
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          for attempt in $(seq 1 35); do
            set +e
            npx eas-cli@latest build:view "${{ inputs.status_build_id }}" --json > eas-build.json
            result=$?
            set -e
            if [ "$result" -ne 0 ]; then
              cat eas-build.json
              exit "$result"
            fi
            cat eas-build.json
            status=$(node -e 'const build=require("./eas-build.json"); console.log(build.status || "")')
            case "$status" in
              finished|errored|canceled)
                exit 0
                ;;
            esac
            sleep 60
          done
          echo "EAS build did not reach a terminal status before the monitor timeout." >&2
          exit 1

  build:
    if: ${{ inputs.status_build_id == '' }}
    name: Submit Expo iOS build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Expo project
        run: |
          npx expo install --check
          npx expo-doctor

      - name: Submit EAS iOS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest build \
            --platform ios \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait
