name: Home Service Connection iOS build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - production
          - testflight
          - preview

permissions:
  contents: read

jobs:
  build:
    name: Submit Expo iOS build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Expo project
        run: |
          npx expo install --check
          npx expo-doctor

      - name: Submit EAS iOS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest build \
            --platform ios \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait
