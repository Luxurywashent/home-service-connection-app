name: Home Service Connection mobile build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Mobile platform to build
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - production
          - testflight
          - preview
      status_build_id:
        description: Optional EAS build ID to monitor instead of creating a build
        required: false
        type: string
      reuse_original_android_upload_key:
        description: Reuse the verified original Play upload key for the corrected Android package
        required: false
        default: false
        type: boolean

      controlled_device_testing:
        description: Use the pinned owner-authorized internal device testing contracts
        required: false
        default: false
        type: boolean
      submission_build_id:
        description: Finished iOS archive to upload ONLY to existing private TestFlight
        required: false
        type: string

permissions:
  contents: read

jobs:
  status:
    if: ${{ inputs.status_build_id != '' && inputs.submission_build_id == '' }}
    name: Monitor private Expo build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Monitor EAS build status
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          for attempt in $(seq 1 35); do
            set +e
            npx eas-cli@latest build:view "${{ inputs.status_build_id }}" --json > eas-build.json
            result=$?
            set -e
            if [ "$result" -ne 0 ]; then
              cat eas-build.json
              exit "$result"
            fi
            cat eas-build.json
            status=$(node -e 'const build=require("./eas-build.json"); console.log(String(build.status || "").toLowerCase())')
            case "$status" in
              finished|errored|canceled)
                exit 0
                ;;
            esac
            sleep 60
          done
          echo "EAS build did not reach a terminal status before the monitor timeout." >&2
          exit 1

      - name: Preserve final EAS metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: private-build-status-${{ inputs.status_build_id }}
          path: eas-build.json
          if-no-files-found: ignore
          retention-days: 14

  build:
    if: ${{ inputs.status_build_id == '' && inputs.submission_build_id == '' }}
    name: Create Expo mobile build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Expo project
        run: |
          npx expo install --check
          npx expo-doctor

      - name: Configure private device artifact only
        if: ${{ inputs.controlled_device_testing }}
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_PROFILE: ${{ inputs.profile }}
        run: |
          node - <<'JS'
          const fs = require('fs');
          const e = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const platform = process.env.BUILD_PLATFORM;
          const profile = process.env.BUILD_PROFILE;
          if ((platform === 'ios' && profile !== 'testflight') || (platform === 'android' && profile !== 'preview')) throw Error('Private device testing permits only TestFlight iOS and internal Android APK');
          const base = e.build.production;
          e.build[profile] = {
            ...base,
            ...e.build[profile],
            autoIncrement: true,
            credentialsSource: 'remote',
            env: { ...base.env, ...e.build[profile].env, EXPO_PUBLIC_HSC_CONTROLLED_DEVICE_TESTING: '80c059cd:b29f99b5:20261118' },
            ...(platform === 'android' ? { distribution: 'internal', android: { buildType: 'apk' } } : {})
          };
          for (const name of ['EXPO_PUBLIC_API_BASE_URL','EXPO_PUBLIC_JOBSYNC_API_BASE_URL']) if (e.build[profile].env[name] !== 'https://jobwash-veysiubh.manus.space') throw Error('Unexpected production API');
          fs.writeFileSync('eas.json', JSON.stringify(e,null,2)+'\n');
          JS

      - name: Verify Android upload certificate
        if: ${{ inputs.platform == 'android' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          REUSE_ORIGINAL_KEY: ${{ inputs.reuse_original_android_upload_key }}
        run: |
          args=()
          if [ "$REUSE_ORIGINAL_KEY" = "true" ]; then args+=(--reuse-original); fi
          node scripts/verify-android-upload-key.mjs "${args[@]}"

      - name: Create EAS mobile build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
          BUILD_PLATFORM: ${{ inputs.platform || 'ios' }}
          BUILD_PROFILE: ${{ inputs.profile }}
        run: |
          test -n "$EXPO_TOKEN"
          case "$BUILD_PLATFORM" in ios|android) ;; *) exit 2 ;; esac
          case "$BUILD_PROFILE" in production|testflight|preview) ;; *) exit 2 ;; esac
          signing_args=()
          if [ "$BUILD_PLATFORM" = "android" ]; then signing_args+=(--freeze-credentials); fi
          npx eas-cli@latest build \
            --platform "$BUILD_PLATFORM" \
            --profile "$BUILD_PROFILE" \
            --non-interactive \
            "${signing_args[@]}" \
            --no-wait --json > eas-created.json
          node - <<'JS'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('eas-created.json','utf8'));
          const builds = Array.isArray(raw) ? raw : [raw];
          if (builds.length !== 1 || !builds[0].id) throw Error('Expected exactly one EAS build');
          fs.writeFileSync('eas-build.json', JSON.stringify(builds[0],null,2)+'\n');
          console.log(JSON.stringify({id: builds[0].id, platform: builds[0].platform, appVersion: builds[0].appVersion, appBuildVersion: builds[0].appBuildVersion}));
          JS
      - name: Preserve private build metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: private-build-metadata-${{ inputs.platform }}
          path: eas-build.json
          if-no-files-found: ignore
          retention-days: 14

  submit:
    if: ${{ inputs.submission_build_id != '' && inputs.platform == 'ios' && inputs.controlled_device_testing && inputs.profile == 'testflight' }}
    name: Upload exact archive to existing private TestFlight only
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify finished archive and restricted destination
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.submission_build_id }}
        run: |
          test -n "$EXPO_TOKEN"
          [[ "$BUILD_ID" =~ ^[a-f0-9-]{36}$ ]]
          npx eas-cli@latest build:view "$BUILD_ID" --json > submission-build.json
          node - <<'JS'
          const fs = require('fs'); const b = JSON.parse(fs.readFileSync('submission-build.json','utf8'));
          if (b.id !== process.env.BUILD_ID || String(b.status).toLowerCase() !== 'finished' || String(b.platform).toLowerCase() !== 'ios') throw Error('Expected finished iOS archive');
          if (b.app?.id !== 'e6614385-618a-460d-a650-06ae63b97563' || b.appIdentifier !== 'com.homeserviceconnection.mobile' || b.appVersion !== '1.0.1') throw Error('Unexpected original app identity/version');
          if (b.distribution && String(b.distribution).toLowerCase() !== 'store') throw Error('Only store-signed TestFlight archive');
          const e = JSON.parse(fs.readFileSync('eas.json','utf8'));
          e.submit.testflight = { extends: 'production', ios: { ascAppId: '6800959195' } };
          fs.writeFileSync('eas.json',JSON.stringify(e,null,2)+'\n');
          JS
      - name: Upload to TestFlight; never review or release
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.submission_build_id }}
        run: npx eas-cli@latest submit --platform ios --profile testflight --id "$BUILD_ID" --non-interactive
